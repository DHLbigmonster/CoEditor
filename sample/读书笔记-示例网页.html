<h1>阅读摘录：门店数字化的三个误区</h1>
<p class="meta">示例网页 · 虚构内容 · 用于演示 CoEditor 对 HTML 的荧光标记与批注</p>
<blockquote>误区一：把数字化等同于上系统。工具落了地，流程没变化，数据只是搬了个地方存放。</blockquote>
<blockquote>误区二：把口径混着用。含外卖与不含外卖的利润率放在一起比较，结论就会失真。</blockquote>
<blockquote>误区三：把试点结论直接外推。试点门店是挑出来的，外推前必须回答选择性偏差。</blockquote>
<p>本文为演示页面：选中任意句子即可弹出批注 / 高亮 / 删除线菜单，荧光标记与批注会锚定到原句，成为给 Agent 的约束。</p>
